<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بطاقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --gold:#c8a65a; --gold2:#b8954a; }
* { box-sizing:border-box; }
html, body { margin:0; width:1200px; height:640px; background:#e9edeb; }
body { display:flex; align-items:center; justify-content:center; font-family:"Amiri","Arabic Typesetting","Traditional Arabic",serif; }
.card { position:relative; width:1060px; height:540px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 90px; }
.card::before { content:""; position:absolute; inset:16px; border:2px solid var(--gold); pointer-events:none; }
.card::after { content:""; position:absolute; inset:24px; border:1px solid var(--gold); opacity:.65; pointer-events:none; }
.dark { background:#173f34; color:#f6efdc; }
.cream { background:#fbf8ef; color:#173f34; }
.emb { position:absolute; top:-30px; left:50%; transform:translateX(-50%); width:60px; height:60px; border-radius:50%; display:grid; place-items:center; border:2px solid var(--gold); }
.dark .emb { background:#173f34; }
.cream .emb { background:#fbf8ef; }
.label { font-size:22px; color:var(--gold); margin-bottom:24px; letter-spacing:.5px; }
.head { font-size:66px; font-weight:700; line-height:1.45; }
.head.long { font-size:56px; }
.line { width:90px; height:2px; background:var(--gold); margin:20px auto; opacity:.9; }
.sub { font-size:29px; line-height:1.7; max-width:820px; }
.dark .sub { color:#d9d0b8; }
.cream .sub { color:#4d5e57; }
.brand { position:absolute; bottom:34px; font-size:18px; color:var(--gold); opacity:.9; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="emb">
    <svg width="34" height="34" viewBox="-17 -17 34 34" aria-hidden="true">
      <g fill="none" stroke="#c8a65a" stroke-width="2">
        <circle r="6"/>
      </g>
      <g stroke="#c8a65a" stroke-width="2.4" stroke-linecap="round" id="rays"></g>
    </svg>
  </div>
  <div class="label" id="label"></div>
  <div class="head" id="head"></div>
  <div class="line" id="line"></div>
  <div class="sub" id="sub"></div>
  <div class="brand">شراكات واستثمار · إتقان</div>
</div>
<script>
const CARDS = [
  { t:"dark",  label:"المشكلة", head:"أفكارٌ ومشاريعُ حبيسةُ الدرج", sub:"أصحابها لا يجدون طريقًا لطلب شريك دون كشفها للجميع، فيُؤثرون السكوت" },
  { t:"cream", label:"القسم اليوم", head:"الشراكة هي الأكثر تفاعلًا…<br>وتستحق مساحةً تليق بها", sub:"في عام كامل: 17 موضوعًا، وأكثرها ردودًا طلبات الشراكة، لا الوظائف المدفوعة", long:true },
  { t:"dark",  label:"الفكرة", head:"اكتب ما تحتاجه…<br>لا ما تبنيه", sub:"تبقى تفاصيل الفكرة مخفية حتى تقبل طلب التواصل" },
  { t:"cream", label:"التواصل", head:"لا أرقام في العلن", sub:"تظهر وسائل التواصل للطرفين فقط، بعد موافقة كليهما" },
  { t:"dark",  label:"الربح والأجر", head:"ربحٌ مبارك… وأجرٌ لا ينقطع", sub:"اتفاقيات مشاركة ومضاربة جاهزة، ونسبة اختيارية من الأرباح تذهب وقفًا للخير" },
  { t:"cream", label:"الخلاصة", head:"يدٌ تبني، ويدٌ تموّل،<br>والبركة في الاجتماع", sub:"مساحة تجمع أصحاب المشاريع الإسلامية بالشركاء والمموّلين", long:true },
];
const n = Math.max(1, Math.min(CARDS.length, +(new URLSearchParams(location.search).get("n") || 1))) - 1;
const c = CARDS[n];
document.getElementById("card").classList.add(c.t);
document.getElementById("label").textContent = c.label;
const h = document.getElementById("head"); h.innerHTML = c.head; if (c.long) h.classList.add("long");
document.getElementById("sub").textContent = c.sub;
const rays = document.getElementById("rays");
for (let i = 0; i < 12; i++) {
  const a = i * Math.PI / 6, r1 = 9.5, r2 = (i % 2 ? 12.5 : 15);
  const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
  l.setAttribute("x1", (r1 * Math.cos(a)).toFixed(2)); l.setAttribute("y1", (r1 * Math.sin(a)).toFixed(2));
  l.setAttribute("x2", (r2 * Math.cos(a)).toFixed(2)); l.setAttribute("y2", (r2 * Math.sin(a)).toFixed(2));
  rays.appendChild(l);
}
</script>
</body>
</html>
